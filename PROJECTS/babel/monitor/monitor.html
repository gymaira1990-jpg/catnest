<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>巴别塔 · 节点监控 / Babel · Node Monitor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #111; color: #ccc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh; display: flex;
        }
        .sidebar {
            width: 280px; min-width: 280px; background: #161616;
            border-right: 1px solid #222; padding: 24px 20px;
            display: flex; flex-direction: column; height: 100vh; position: sticky; top: 0;
        }
        .sidebar .badge {
            display: inline-block; background: #1a1a2e; color: #6677aa;
            font-size: 10px; padding: 2px 8px; border-radius: 3px;
            letter-spacing: 1px; margin-bottom: 8px;
        }
        .sidebar h2 {
            font-size: 13px; font-weight: 500; letter-spacing: 2px;
            color: #666; text-transform: uppercase; margin: 20px 0 12px;
        }
        .sidebar h2:first-child { margin-top: 0; }
        .sidebar p { font-size: 12px; line-height: 1.7; color: #777; margin-bottom: 8px; }
        .sidebar .links { list-style: none; }
        .sidebar .links li { margin-bottom: 6px; }
        .sidebar .links a {
            color: #5588cc; text-decoration: none; font-size: 12px;
            display: block; padding: 4px 0;
        }
        .sidebar .links a:hover { color: #88aadd; }
        .sidebar .links a::before { content: "→ "; color: #555; }
        .sidebar .tagline {
            margin-top: auto; padding-top: 20px; font-size: 10px;
            color: #444; letter-spacing: 2px; text-align: center;
            border-top: 1px solid #222;
        }
        .main {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center; padding: 40px 20px;
        }
        h1 {
            font-size: 18px; font-weight: 400; letter-spacing: 4px;
            color: #888; margin-bottom: 4px; text-transform: uppercase;
        }
        .subtitle { font-size: 12px; color: #555; margin-bottom: 32px; letter-spacing: 2px; }
        .status-panel {
            background: #1a1a1a; border: 1px solid #333; border-radius: 4px;
            padding: 32px 48px; text-align: center; min-width: 360px;
        }
        .node-status {
            display: inline-block; padding: 4px 16px; border-radius: 12px;
            font-size: 12px; letter-spacing: 2px; margin-bottom: 24px;
        }
        .node-status.online { background: #0a2e1a; color: #66aa88; border: 1px solid #1a4a2a; }
        .node-status.offline { background: #2e0a0a; color: #aa6666; border: 1px solid #4a1a1a; }
        .countdown-container { margin: 24px 0; }
        .countdown-label { font-size: 11px; color: #555; letter-spacing: 2px; margin-bottom: 8px; }
        .countdown {
            font-size: 48px; font-weight: 300; letter-spacing: 4px;
            color: #ddd; font-variant-numeric: tabular-nums;
        }
        .countdown span { color: #6677aa; }
        .stats-row {
            display: flex; justify-content: center; gap: 48px;
            margin-top: 24px; padding-top: 24px; border-top: 1px solid #222;
        }
        .stat-item { text-align: center; }
        .stat-value { color: #ddd; font-size: 24px; font-weight: 500; }
        .stat-label { font-size: 10px; color: #555; text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }
        .last-heartbeat { margin-top: 16px; font-size: 11px; color: #555; }
        .last-heartbeat .time { color: #888; }
        .footer {
            margin-top: 32px; font-size: 10px; color: #444;
            letter-spacing: 1px; text-align: center;
        }
        .footer a { color: #555; text-decoration: none; }
        @media (max-width: 800px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; min-width: 100%; height: auto; position: static; }
            .status-panel { min-width: auto; padding: 24px; }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="badge">NODE MONITOR</div>
        <h2>关于</h2>
        <p>巴别塔实验的节点监控面板。</p>
        <p>每1小时检测一次代理链路状态。
           在线=画布可达, 离线=链路中断。</p>
        <h2>链接</h2>
        <ul class="links">
            <li><a href="https://github.com/gymaira1990-jpg/babel-experiment" target="_blank">巴别塔实验 GitHub</a></li>
            <li><a href="https://github.com/gymaira1990-jpg/noah-world-protocol" target="_blank">诺亚世界协议</a></li>
        </ul>
        <div class="tagline">活着就是成功，停运就是失败</div>
    </div>

    <div class="main">
        <h1>节点 · 心跳监控</h1>
        <div class="subtitle">Node · Heartbeat Monitor</div>

        <div class="status-panel">
            <div class="node-status" id="nodeStatus">● 检测中...</div>

            <div class="countdown-container">
                <div class="countdown-label">下次检测 / Next Check</div>
                <div class="countdown" id="countdown">--:--:--</div>
            </div>

            <div class="stats-row">
                <div class="stat-item">
                    <div class="stat-value" id="totalSignals">0</div>
                    <div class="stat-label">已检测 / Checks</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="uptime">--</div>
                    <div class="stat-label">在线时长 / Uptime</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="lastDelay">--</div>
                    <div class="stat-label">延迟 / Latency</div>
                </div>
            </div>

            <div class="last-heartbeat">
                上次检测: <span class="time" id="lastBeatTime">--</span>
            </div>
        </div>

        <div class="footer">
            活着就是成功，停运就是失败 &nbsp;|&nbsp;
            <a href="https://github.com/gymaira1990-jpg/babel-experiment" target="_blank">GitHub</a>
        </div>
    </div>

    <script>
        const STATE = {
            total_sent: 0, last_success: null,
            next_heartbeat: null, node_online: false,
            uptime_seconds: 0, latency_ms: 0,
        };

        function fmt(n) { return String(n).padStart(2, '0'); }

        function updateDisplay() {
            const statusEl = document.getElementById('nodeStatus');
            statusEl.className = 'node-status ' + (STATE.node_online ? 'online' : 'offline');
            statusEl.textContent = STATE.node_online ? '● 在线 · ONLINE' : '● 离线 · OFFLINE';
            document.getElementById('totalSignals').textContent = STATE.total_sent;
            if (STATE.last_success) {
                document.getElementById('lastBeatTime').textContent =
                    new Date(STATE.last_success).toLocaleString();
            }
            if (STATE.latency_ms > 0) {
                document.getElementById('lastDelay').textContent = STATE.latency_ms + 'ms';
            }
        }

        function updateCountdown() {
            if (STATE.next_heartbeat) {
                const diff = Math.max(0, new Date(STATE.next_heartbeat) - Date.now());
                const h = Math.floor(diff / 3600000);
                const m = Math.floor((diff % 3600000) / 60000);
                const s = Math.floor((diff % 60000) / 1000);
                document.getElementById('countdown').innerHTML =
                    fmt(h) + ':' + fmt(m) + ':<span>' + fmt(s) + '</span>';
            }
        }

        function fetchStatus() {
            fetch('/status.json?_=' + Date.now())
                .then(r => r.json())
                .then(data => { Object.assign(STATE, data); updateDisplay(); })
                .catch(() => { STATE.node_online = false; updateDisplay(); });
        }

        fetchStatus();
        setInterval(fetchStatus, 30000);
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
