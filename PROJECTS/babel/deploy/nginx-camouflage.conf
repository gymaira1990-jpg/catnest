# 巴别塔实验 · Nginx 伪装反向代理配置
# Babel Experiment · Nginx Camouflage Reverse Proxy
#
# 用途: 将画布服务器隐藏在Nginx后面, 共享443端口
#       外部访问者看到的是画布页面, 不是原始API
#
# 使用方法:
#   sudo ln -sf /path/to/this/file /etc/nginx/sites-available/babel-canvas
#   sudo ln -sf /etc/nginx/sites-available/babel-canvas /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;

    # HTTP → HTTPS 重定向 (需要先配置好证书)
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name your-domain.com;

    # ── SSL 证书（推荐 Let's Encrypt）──
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ── 画布页面（伪装首页）──
    # 访问者看到的是巴别塔画布, 而非API服务
    location / {
        proxy_pass http://127.0.0.1:8800/view;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 画布核心API ──
    location /canvas {
        proxy_pass http://127.0.0.1:8800;
        proxy_set_header Host $host;
    }
    location /stats {
        proxy_pass http://127.0.0.1:8800;
        proxy_set_header Host $host;
    }
    location /signal {
        proxy_pass http://127.0.0.1:8800;
        proxy_set_header Host $host;
    }
    location /admin {
        proxy_pass http://127.0.0.1:8800;
        proxy_set_header Host $host;
    }
}
