# ─────────────────────────────────────────────
# NEURON-01 配置文件
# 用户可直接修改此文件，无需改动 AI 提示词
# ─────────────────────────────────────────────

# 模板创建策略
# first_use  — 首次使用未匹配类型即提议创建新模板（推荐）
# after_3    — 使用3次后才提议（保守）
# manual     — 仅当用户主动要求时才创建
template_creation: first_use

# 搜索深度
# hot   — 仅搜索热索引（最快，最省 token）
# warm  — 搜索热+常温索引（默认）
# cold  — 搜索热+常温+冷索引
# full  — 搜索全部索引 + 跨会话搜索（最全面，但最耗 token）
search_depth: warm

# 语言偏好
# chinese — 全部用中文回应
# english — 全部用英文回应
# mixed  — 代号用英文，说明用中文（默认）
language: mixed

# 安全门闸模式
# strict — 关键词匹配 + 行为评分 双重门闸全开（推荐）
# light  — 仅关键词门闸（适合信任模式）
# off    — 关闭门闸（不推荐，AI可能越权执行）
gate_mode: strict

# 会话启动自动汇报
# true  — 启动时自动报告当前活跃任务（推荐）
# false — 仅当用户询问时才汇报
auto_report: true
